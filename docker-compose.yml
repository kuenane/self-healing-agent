services:
  agent:
    build: .
    container_name: self-healing-agent
    environment:
      PHOENIX_MCP_URL: ${PHOENIX_MCP_URL:-http://phoenix:6006}
      PHOENIX_API_KEY: ${PHOENIX_API_KEY:-}
      REDIS_URL: redis://redis:6379
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: self-healing-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: self-healing-agent-phoenix
    ports:
      - "6006:6006"
    environment:
      PHOENIX_SQL_DATABASE_URL: sqlite:///phoenix.db

volumes:
  redis-data:
